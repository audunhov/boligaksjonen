<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit House - Boligaksjonen</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 100px; }
        .actions { margin-top: 20px; }
        .btn { padding: 10px 15px; text-decoration: none; border-radius: 4px; cursor: pointer; border: none; }
        .btn-primary { background: #3498db; color: white; }
        .btn-secondary { background: #95a5a6; color: white; }
        .info { font-size: 0.9em; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Edit House Entry</h1>
    <p>Last updated by: <strong>{{.LastUpdatedBy}}</strong> on <strong>{{.UpdatedAt | formatDate}}</strong></p>

    <form action="/houses/update" method="POST">
        <input type="hidden" name="id" value="{{.ID}}">
        
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" value="{{.Address}}" required>
        </div>

        <div class="form-group">
            <label for="lat">Latitude</label>
            <input type="number" step="any" id="lat" name="lat" value="{{.Latitude}}" required>
        </div>

        <div class="form-group">
            <label for="lng">Longitude</label>
            <input type="number" step="any" id="lng" name="lng" value="{{.Longitude}}" required>
        </div>

        <div class="form-group">
            <label for="ownership_type">Ownership Type</label>
            <select id="ownership_type" name="ownership_type" onchange="toggleFreetext(this.value)">
                <option value="kommune" {{if eq .OwnershipType "kommune"}}selected{{end}}>Kommune</option>
                <option value="fylke" {{if eq .OwnershipType "fylke"}}selected{{end}}>Fylke</option>
                <option value="stat" {{if eq .OwnershipType "stat"}}selected{{end}}>Stat</option>
                <option value="privatperson" {{if eq .OwnershipType "privatperson"}}selected{{end}}>Privatperson</option>
                <option value="selskap" {{if eq .OwnershipType "selskap"}}selected{{end}}>Selskap</option>
                <option value="freetext" {{if and (ne .OwnershipType "kommune") (ne .OwnershipType "fylke") (ne .OwnershipType "stat") (ne .OwnershipType "privatperson") (ne .OwnershipType "selskap")}}selected{{end}}>Freetext / Other</option>
            </select>
        </div>

        <div id="freetext_group" class="form-group" style="display: {{if and (ne .OwnershipType "kommune") (ne .OwnershipType "fylke") (ne .OwnershipType "stat") (ne .OwnershipType "privatperson") (ne .OwnershipType "selskap")}}block{{else}}none{{end}};">
            <label for="ownership_freetext">Specify Ownership Type</label>
            <input type="text" id="ownership_freetext" name="ownership_freetext" value="{{.OwnershipType}}">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" required>{{.Description}}</textarea>
        </div>

        <div class="form-group">
            <label for="author">Your Name (optional)</label>
            <input type="text" id="author" name="author" placeholder="Anonymous">
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>

    <script>
        function toggleFreetext(value) {
            const freetextGroup = document.getElementById('freetext_group');
            if (value === 'freetext') {
                freetextGroup.style.display = 'block';
                document.getElementById('ownership_freetext').required = true;
            } else {
                freetextGroup.style.display = 'none';
                document.getElementById('ownership_freetext').required = false;
            }
        }
    </script>

    <p class="info">By clicking "Save Changes", you are updating this entry publicly. The latest version will be displayed on the map.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Bolig - Kart</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet.markercluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        
        /* Toolbar Styles */
        .toolbar { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            background: white; 
            padding: 8px 15px; 
            border-radius: 50px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            display: flex; 
            align-items: center; 
            gap: 12px;
            white-space: nowrap;
        }
        .toolbar h1 { margin: 0; font-size: 1.1em; color: #2c3e50; border-right: 1px solid #ddd; padding-right: 12px; }
        .toolbar-btn { 
            background: none; 
            border: none; 
            color: #34495e; 
            font-size: 0.9em; 
            font-weight: 500; 
            cursor: pointer; 
            padding: 5px 10px; 
            border-radius: 20px; 
            text-decoration: none;
            transition: background 0.2s;
        }
        .toolbar-btn:hover { background: #f0f2f5; color: #3498db; }
        .toolbar-btn.primary { background: #3498db; color: white; }
        .toolbar-btn.primary:hover { background: #2980b9; color: white; }
        .toolbar-user { font-size: 0.85em; color: #7f8c8d; border-left: 1px solid #ddd; padding-left: 12px; margin-left: 5px; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8em; margin-top: 5px; margin-bottom: 5px; text-transform: capitalize; background-color: #eee; color: #333; }
        .badge-privat-bolig { background-color: #27ae60; color: white; }
        .badge-privat-bygård { background-color: #2ecc71; color: white; }
        .badge-offentlig { background-color: #3498db; color: white; }
        .badge-næring { background-color: #f1c40f; color: #333; }
        .badge-industri { background-color: #95a5a6; color: white; }
        .badge-gård { background-color: #d35400; color: white; }
        .badge-annet { background-color: #bdc3c7; color: #333; }

        /* Dialog Styles */
        dialog { border: none; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); padding: 0; width: 90%; max-width: 500px; }
        dialog::backdrop { background: rgba(0,0,0,0.5); }
        .dialog-content { padding: 20px; }
        .dialog-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding: 15px 20px; background: #f8f9fa; }
        .dialog-header h2 { margin: 0; font-size: 1.25em; }
        
        .form-group { margin-bottom: 15px; padding: 0 20px; }
        .form-group:first-of-type { margin-top: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 80px; }
        .dialog-actions { padding: 15px 20px; border-top: 1px solid #ddd; text-align: right; background: #f8f9fa; }
        .btn { padding: 8px 16px; border-radius: 4px; cursor: pointer; border: none; font-size: 0.9em; font-weight: bold; }
        .btn-primary { background: #3498db; color: white; }
        .btn-secondary { background: #95a5a6; color: white; margin-right: 8px; }

        .lookup-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 0.9em; }
        .lookup-item:last-child { border-bottom: none; }
        .lookup-item:hover { background: #f0f7ff; }
        .lookup-item .poststed { color: #666; font-size: 0.85em; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>Tom Bolig</h1>
        <button class="toolbar-btn primary" onclick="openAddModal()">Report</button>
        <a href="/kart/historikk" class="toolbar-btn">History</a>
        <a href="/" class="toolbar-btn">Home</a>
        {{if .UserID}}
            <div class="toolbar-user">
                <strong>{{.Username}}</strong>
                <a href="/logout" class="toolbar-btn" style="color:#e74c3c;">Logout</a>
            </div>
        {{else}}
            <button class="toolbar-btn" onclick="document.getElementById('loginDialog').showModal()">Login</button>
            <button class="toolbar-btn" onclick="document.getElementById('signupDialog').showModal()">Signup</button>
        {{end}}
    </div>
    
    <div id="map"></div>

    <!-- Login Dialog -->
    <dialog id="loginDialog">
        <div class="dialog-header">
            <h2>Login</h2>
            <button class="btn" style="background:none; color:#666; font-size:1.5em; padding:0;" onclick="document.getElementById('loginDialog').close()">&times;</button>
        </div>
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="login_username">Username</label>
                <input type="text" id="login_username" name="username" required>
            </div>
            <div class="form-group">
                <label for="login_password">Password</label>
                <input type="password" id="login_password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div class="dialog-actions">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('loginDialog').close()">Cancel</button>
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
    </dialog>

    <!-- Signup Dialog -->
    <dialog id="signupDialog">
        <div class="dialog-header">
            <h2>Signup</h2>
            <button class="btn" style="background:none; color:#666; font-size:1.5em; padding:0;" onclick="document.getElementById('signupDialog').close()">&times;</button>
        </div>
        <form action="/signup" method="POST">
            <div class="form-group">
                <label for="signup_username">Username</label>
                <input type="text" id="signup_username" name="username" required>
            </div>
            <div class="form-group">
                <label for="signup_password">Password</label>
                <input type="password" id="signup_password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div class="dialog-actions">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('signupDialog').close()">Cancel</button>
                <button type="submit" class="btn btn-primary">Signup</button>
            </div>
        </form>
    </dialog>

    <!-- Edit Dialog -->
    <dialog id="editDialog">
        <div class="dialog-header">
            <h2 id="dialog_title">Edit House Entry</h2>
            <button class="btn" style="background:none; color:#666; font-size:1.5em; padding:0;" onclick="document.getElementById('editDialog').close()">&times;</button>
        </div>
        <form id="editForm" action="/houses/update" method="POST">
            <input type="hidden" id="edit_id" name="id">
            
            <div class="form-group">
                <label for="edit_address">Address</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="edit_address" name="address" required placeholder="e.g. Storgata 10, Oslo">
                    <button type="button" class="btn btn-secondary" style="white-space: nowrap; font-size: 0.8em;" onclick="lookupCoordinates()">Lookup</button>
                </div>
                <div id="lookup_status" style="font-size: 0.8em; margin-top: 5px; color: #666;"></div>
                <div id="lookup_results" style="max-height: 150px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; margin-top: 5px; display: none; background: #fff;"></div>
            </div>

            <div style="display: flex; gap: 10px; padding: 0 20px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label for="edit_lat">Latitude</label>
                    <input type="number" step="any" id="edit_lat" name="lat" required readonly style="background-color: #f0f0f0; color: #666; cursor: not-allowed;">
                </div>
                <div style="flex: 1;">
                    <label for="edit_lng">Longitude</label>
                    <input type="number" step="any" id="edit_lng" name="lng" required readonly style="background-color: #f0f0f0; color: #666; cursor: not-allowed;">
                </div>
            </div>

            <div class="form-group">
                <label for="edit_ownership_type">Building Type / Ownership</label>
                <select id="edit_ownership_type" name="ownership_type" onchange="toggleFreetext(this.value)">
                    <option value="privat-bolig">Privat bolig (Enebolig, rekkehus)</option>
                    <option value="privat-bygård">Privat bygård/blokk</option>
                    <option value="offentlig">Kommunal/Offentlig bygg</option>
                    <option value="næring">Næringslokale/Butikk</option>
                    <option value="industri">Industri/Lager</option>
                    <option value="gård">Gård/Småbruk</option>
                    <option value="annet">Annet / Vet ikke</option>
                    <option value="freetext">Specify other...</option>
                </select>
            </div>

            <div id="edit_freetext_group" class="form-group" style="display: none;">
                <label for="edit_ownership_freetext">Specify Category</label>
                <input type="text" id="edit_ownership_freetext" name="ownership_freetext">
            </div>

            <div class="form-group">
                <label for="edit_description">Description</label>
                <textarea id="edit_description" name="description" required></textarea>
            </div>

            <div class="dialog-actions">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('editDialog').close()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </dialog>

    <script>
        function openAddModal() {
            document.getElementById('editForm').reset();
            document.getElementById('edit_id').value = "0";
            document.getElementById('dialog_title').innerText = "Report Empty House";
            document.getElementById('edit_freetext_group').style.display = 'none';
            document.getElementById('lookup_status').innerText = '';
            document.getElementById('editDialog').showModal();
        }

        function toggleFreetext(value) {
            const freetextGroup = document.getElementById('edit_freetext_group');
            const freetextInput = document.getElementById('edit_ownership_freetext');
            if (value === 'freetext') {
                freetextGroup.style.display = 'block';
                freetextInput.required = true;
            } else {
                freetextGroup.style.display = 'none';
                freetextInput.required = false;
            }
        }

        async function lookupCoordinates() {
            const address = document.getElementById('edit_address').value;
            const statusDiv = document.getElementById('lookup_status');
            const resultsDiv = document.getElementById('lookup_results');
            
            if (!address) {
                statusDiv.innerText = 'Please enter an address first.';
                statusDiv.style.color = 'red';
                return;
            }

            statusDiv.innerText = 'Looking up...';
            statusDiv.style.color = '#666';
            resultsDiv.style.display = 'none';
            resultsDiv.innerHTML = '';

            try {
                // Request up to 10 results to allow user to choose
                const response = await fetch(`https://ws.geonorge.no/adresser/v1/sok?sok=${encodeURIComponent(address)}&treffPerSide=10`);
                const data = await response.json();

                if (data.adresser && data.adresser.length > 0) {
                    statusDiv.innerText = `Found ${data.adresser.length} results. Please select:`;
                    resultsDiv.style.display = 'block';
                    
                    data.adresser.forEach(addr => {
                        const item = document.createElement('div');
                        item.className = 'lookup-item';
                        item.innerHTML = `${addr.adressetekst} <span class="poststed">${addr.poststed}</span>`;
                        item.onclick = () => selectAddress(addr);
                        resultsDiv.appendChild(item);
                    });
                } else {
                    statusDiv.innerText = 'No addresses found.';
                    statusDiv.style.color = 'red';
                }
            } catch (error) {
                console.error('Geonorge lookup error:', error);
                statusDiv.innerText = 'Error connecting to Geonorge API.';
                statusDiv.style.color = 'red';
            }
        }

        function selectAddress(addr) {
            document.getElementById('edit_address').value = addr.adressetekst;
            document.getElementById('edit_lat').value = addr.representasjonspunkt.lat;
            document.getElementById('edit_lng').value = addr.representasjonspunkt.lon;
            
            const statusDiv = document.getElementById('lookup_status');
            const resultsDiv = document.getElementById('lookup_results');
            
            statusDiv.innerText = `Selected: ${addr.adressetekst}, ${addr.poststed}`;
            statusDiv.style.color = 'green';
            resultsDiv.style.display = 'none';
        }
    </script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet.markercluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <!-- Custom Map Initialization -->
    <script src="/static/js/map.js"></script>
</body>
</html>
